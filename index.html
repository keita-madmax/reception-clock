<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reception Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", sans-serif;
    }
    #player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    #player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.77vh;
      transform: translate(-50%, -50%);
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 4vw;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 10;
    }
    .date {
      font-size: 2vw;
      font-weight: 300;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }
    .time {
      font-size: 7vw;
      font-weight: 200;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
  </style>

  <!-- 全画面（スタンドアロン表示）のための設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reception">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iPadOSにアプリとして認識させるマニフェスト設定 -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Reception%22%2C%22short_name%22%3A%22Reception%22%2C%22display%22%3A%22fullscreen%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">
</head>
<body>

  <div id="player-wrapper">
    <div id="player"></div>
  </div>

  <div class="overlay">
    <div class="date" id="date-display">--月--日 ---</div>
    <div class="time" id="time-display">00:00</div>
  </div>

  <script>
    // 確実に埋め込み再生できる動画IDに変更（ロフィ風の環境アニメーション風景）
    // 別の風景にしたい場合はここのIDを書き換えてください
    const YOUTUBE_VIDEO_ID = '_dM9Vc6QP7o'; 

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: {
          autoplay: 1,
          controls: 0,
          showinfo: 0,
          modestbranding: 1,
          loop: 1,
          playlist: YOUTUBE_VIDEO_ID,
          mute: 1,
          playsinline: 1,       // iOSでの全画面強制解除を防ぐ必須設定
          enablejsapi: 1,
          origin: window.location.origin
        },
        events: {
          onReady: function(e) {
            e.target.mute();    // iOS制限対策：明示的にミュート
            e.target.playVideo();
          },
          onError: function(e) {
            console.error("YouTube Player Error Code:", e.data);
          }
        }
      });
    }

    // ブラウザの自動再生ブロック対策：画面タップで再生キック
    window.addEventListener('touchstart', function() {
      if (player && typeof player.playVideo === 'function') {
        player.playVideo();
      }
    }, { once: true });

    // 時計の更新
    function updateClock() {
      const now = new Date();
      const options = { month: 'numeric', day: 'numeric', weekday: 'short' };
      document.getElementById('date-display').textContent = now.toLocaleDateString('ja-JP', options);

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time-display').textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
