<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reception Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none; 
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", sans-serif;
    }
    /* 背景動画コンテナ */
    #player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* タッチ無効化 */
      overflow: hidden;
    }
    #player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw; /* 16:9比率維持 */
      min-height: 100vh;
      min-width: 177.77vh;
      transform: translate(-50%, -50%);
    }
    /* 時計オーバーレイ */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* 下部配置（中央にしたい場合は center） */
      align-items: flex-start;  /* 左下配置（右下にしたい場合は flex-end） */
      padding: 4vw;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7); /* 明るい映像でも文字を視認可能に */
      pointer-events: none;
    }
    .date {
      font-size: 1.8vw;
      font-weight: 300;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }
    .time {
      font-size: 6.5vw;
      font-weight: 200;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
  </style>
</head>
<body>

  <div id="player-wrapper">
    <div id="player"></div>
  </div>

  <div class="overlay">
    <div class="date" id="date-display">--月--日 ---</div>
    <div class="time" id="time-display">00:00</div>
  </div>

  <script>
    // 1. YouTube 動画のIDを指定（URLの "v=" の後ろの英数字）
    // 例: https://www.youtube.com/watch?v=dQw4w9WgXcQ なら "dQw4w9WgXcQ"
    const YOUTUBE_VIDEO_ID = 'DeSiSg2e1MY'; // ※4K自然風景の例

    // 2. YouTube IFrame APIの読み込み
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: {
          autoplay: 1,
          controls: 0,        // シークバーや設定ボタンを非表示
          showinfo: 0,
          modestbranding: 1,
          loop: 1,
          playlist: YOUTUBE_VIDEO_ID, // ループ再生に必須
          fs: 0,
          cc_load_policy: 0,
          iv_load_policy: 3,
          autohide: 1,
          mute: 1             // 自動再生のためにミュート必須
        },
        events: {
          onReady: (e) => e.target.playVideo()
        }
      });
    }

    // 3. 時計の更新処理
    function updateClock() {
      const now = new Date();
      
      // 日付フォーマット (例: 10月24日 金曜日)
      const options = { month: 'numeric', day: 'numeric', weekday: 'short' };
      document.getElementById('date-display').textContent = now.toLocaleDateString('ja-JP', options);

      // 時刻フォーマット (例: 14:05)
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time-display').textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
