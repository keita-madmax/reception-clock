<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reception Clock</title>

  <!-- 全画面設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reception">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Reception%22%2C%22short_name%22%3A%22Reception%22%2C%22display%22%3A%22fullscreen%22%2C%22background-color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", sans-serif;
    }
    #player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    #player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.77vh;
      transform: translate(-50%, -50%);
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 4vw;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 10;
    }
    .date {
      font-size: 2vw;
      font-weight: 300;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }
    .time {
      font-size: 7vw;
      font-weight: 200;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    /* 音声案内（タップを促す控えめな表示） */
    .sound-hint {
      position: absolute;
      top: 24px;
      right: 24px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      transition: opacity 0.5s ease;
      z-index: 20;
    }
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="player-wrapper">
    <div id="player"></div>
  </div>

  <!-- 初回タップ前だけ右上に表示される案内 -->
  <div class="sound-hint" id="sound-hint">画面タップで音声ON</div>

  <div class="overlay">
    <div class="date" id="date-display">--月--日 ---</div>
    <div class="time" id="time-display">00:00</div>
  </div>

  <script>
    const YOUTUBE_VIDEO_ID = 'DeSiSg2e1MY&t=6575s'; 
    const DEFAULT_VOLUME = 30; // 音量 (0〜100) ※オフィスの環境に合わせて調整してください

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: {
          autoplay: 1,
          controls: 0,
          showinfo: 0,
          modestbranding: 1,
          loop: 1,
          playlist: YOUTUBE_VIDEO_ID,
          mute: 1, // 自動再生を通すために必須
          playsinline: 1,
          enablejsapi: 1
        },
        events: {
          onReady: function(e) {
            e.target.mute();
            e.target.playVideo();
          },
          onError: function(e) {
            console.error("YouTube Player Error Code:", e.data);
          }
        }
      });
    }

    // 画面を1回タップした時にミュートを解除し、音声を流す
    function enableAudio() {
      if (player && typeof player.unMute === 'function') {
        player.unMute();
        player.setVolume(DEFAULT_VOLUME);
        player.playVideo();

        // 案内表示を非表示にする
        const hint = document.getElementById('sound-hint');
        if (hint) {
          hint.classList.add('hidden');
        }
      }
    }

    window.addEventListener('touchstart', enableAudio, { once: true });
    window.addEventListener('click', enableAudio, { once: true });

    // 時計の更新処理
    function updateClock() {
      const now = new Date();
      const options = { month: 'numeric', day: 'numeric', weekday: 'short' };
      document.getElementById('date-display').textContent = now.toLocaleDateString('ja-JP', options);

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time-display').textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
